<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全商英検3級対策アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px 20px;
        }

        /* ===== ホーム画面 ===== */
        #homeScreen {
            display: none;
        }

        #homeScreen.active {
            display: block;
        }

        .home-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .home-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        .home-header p {
            color: #555;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 2px solid #d0d0d0;
        }

        .stat-card h3 {
            font-size: 12px;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .daily-progress {
            margin-bottom: 30px;
        }

        .daily-progress h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #1a1a1a;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lesson-btn {
            background: #f5f5f5;
            border: 2px solid #d0d0d0;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
        }

        .lesson-btn:hover:not(:disabled) {
            border-color: #667eea;
            transform: translateX(5px);
            background: #f0f4ff;
        }

        .lesson-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lesson-btn .lesson-title {
            display: block;
            margin-bottom: 5px;
            color: #1a1a1a;
            font-weight: 600;
        }

        .lesson-btn .lesson-status {
            font-size: 12px;
            color: #666;
        }

        /* ===== レッスン画面 ===== */
        #lessonScreen {
            display: none;
        }

        #lessonScreen.active {
            display: block;
        }

        .lesson-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .lesson-header h2 {
            font-size: 20px;
            color: #1a1a1a;
        }

        .lesson-close {
            background: #e0e0e0;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            color: #333;
        }

        .lesson-close:hover {
            background: #d0d0d0;
        }

        .progress-indicator {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e0e0e0;
            transition: all 0.3s ease;
        }

        .progress-dot.completed {
            background: #4caf50;
        }

        .progress-dot.current {
            background: #667eea;
            width: 12px;
            height: 12px;
            margin: -2px;
        }

        .question-area {
            margin-bottom: 30px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-text {
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
            color: #1a1a1a;
            flex: 1;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #f5f5f5;
            border: 2px solid #d0d0d0;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 500;
            flex: 1;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option-btn.selected {
            border-color: #667eea;
            background: #e3f2fd;
        }

        .option-btn.correct {
            border-color: #4caf50;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .option-btn.incorrect {
            border-color: #f44336;
            background: #ffebee;
            color: #b71c1c;
        }

        .flashcard {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            flex: 1;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        .flashcard-front {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .flashcard-back {
            font-size: 22px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .flashcard-hint {
            font-size: 14px;
            opacity: 0.95;
            margin-top: 15px;
            color: #e3f2fd;
        }

        /* ===== 発音ボタン ===== */
        .speak-btn {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            min-width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
            flex-shrink: 0;
            font-weight: bold;
        }

        .speak-btn:hover:not(:disabled) {
            background: #ffb300;
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.5);
        }

        .speak-btn:active {
            transform: scale(0.95);
        }

        .speak-btn:disabled {
            background: #999;
            color: #f5f5f5;
            cursor: not-allowed;
            box-shadow: 0 2px 6px rgba(153, 153, 153, 0.3);
        }

        .speak-btn-small {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 6px 8px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(255, 193, 7, 0.3);
            flex-shrink: 0;
            font-weight: bold;
        }

        .speak-btn-small:hover:not(:disabled) {
            background: #ffb300;
            transform: scale(1.1);
        }

        .speak-btn-small:active {
            transform: scale(0.95);
        }

        .speak-btn-small:disabled {
            background: #999;
            color: #f5f5f5;
            cursor: not-allowed;
            box-shadow: 0 2px 6px rgba(153, 153, 153, 0.3);
        }

        /* ===== 結果画面 ===== */
        #resultScreen {
            display: none;
        }

        #resultScreen.active {
            display: block;
        }

        .result-content {
            text-align: center;
        }

        .result-content h2 {
            color: #1a1a1a;
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .result-message {
            font-size: 18px;
            margin-bottom: 30px;
            color: #1a1a1a;
            font-weight: 500;
        }

        .result-details {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
            border: 1px solid #d0d0d0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #d0d0d0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #555;
            font-weight: 500;
        }

        .detail-value {
            font-weight: bold;
            color: #1a1a1a;
        }

        /* ===== ボタン ===== */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            background: #d0d0d0;
            color: #1a1a1a;
        }

        button.secondary:hover:not(:disabled) {
            background: #b8b8b8;
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }

            .home-header h1 {
                font-size: 28px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .lesson-header h2 {
                font-size: 18px;
            }

            .result-score {
                font-size: 36px;
            }

            .flashcard-front {
                font-size: 24px;
            }

            .flashcard-back {
                font-size: 18px;
            }

            .speak-btn {
                padding: 6px 10px;
                font-size: 18px;
                min-width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ホーム画面 -->
        <div id="homeScreen" class="active">
            <div class="home-header">
                <h1>📚 全商英検3級</h1>
                <p>毎日コツコツ学習しましょう</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>🔥 ストリーク</h3>
                    <div class="value" id="streakValue">0</div>
                </div>
                <div class="stat-card">
                    <h3>⏱️ 総学習時間</h3>
                    <div class="value" id="totalTimeValue">0分</div>
                </div>
            </div>

            <div class="daily-progress">
                <h3>本日の進捗</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="dailyProgressFill"></div>
                </div>
                <p style="font-size: 12px; color: #666; margin-top: 5px;">
                    <span id="completedToday">0</span> / <span id="totalLessonsCount">0</span> レッスン完了
                </p>
            </div>

            <div class="lessons-list" id="lessonsList"></div>

            <div class="btn-group">
                <button class="secondary" onclick="resetAllData()">全データをリセット</button>
            </div>
        </div>

        <!-- レッスン画面 -->
        <div id="lessonScreen">
            <div class="lesson-header">
                <h2 id="lessonTitle">レッスン</h2>
                <button class="lesson-close" onclick="exitLesson()">×</button>
            </div>

            <div class="progress-indicator" id="progressIndicator"></div>

            <div class="question-area" id="questionArea"></div>

            <div class="btn-group">
                <button id="nextBtn" onclick="nextQuestion()" disabled>次へ</button>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="resultScreen">
            <div class="result-content">
                <h2 style="margin-bottom: 20px;">レッスン完了！</h2>
                <div class="result-score" id="resultScore">0%</div>
                <div class="result-message" id="resultMessage">お疲れ様でした</div>

                <div class="result-details">
                    <div class="detail-row">
                        <span class="detail-label">正解数</span>
                        <span class="detail-value" id="correctCount">0</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">完了時間</span>
                        <span class="detail-value" id="completionTime">0秒</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button onclick="goHome()">ホームに戻る</button>
                    <button class="secondary" onclick="retryLesson()">もう一度やる</button>
                </div>
            </div>
        </div>
    </div>

    <script src="lessons.js"></script>
    <script src="app.js"></script>
</body>
</html>
